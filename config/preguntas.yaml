# =====================================================================
#  Bancos teóricos (opción múltiple) — Tarea 3A
# ---------------------------------------------------------------------
#  `correcta` es el índice (0 = la primera opción listada) de la opción
#  buena. El motor baraja las opciones y reetiqueta a) b) c) d), así que la
#  letra que ve el alumno NO es la de este archivo.
#  FLOTANTES    -> pregunta 1 (va tras los laboratorios de flotantes)
#  HORNER_INTRO -> pregunta 2 (va antes de programar)
#  HORNER_CONCL -> pregunta 7 (va al final, después de la deflación)
# =====================================================================
HORNER_INTRO:
  - id: "hintro_01"
    titulo: "Cuánto ahorra la forma anidada"
    pregunta: >-
      Para evaluar un polinomio de grado $n$ **término a término** se calculan todas
      las potencias $x^2, x^3, \dots, x^n$, lo que cuesta $O(n^2)$ multiplicaciones.
      La **forma anidada de Horner** las reduce a $O(n)$.
      **¿Cuántas multiplicaciones necesita Horner?**
    opciones:
      - "a) Exactamente $n$ multiplicaciones y $n$ sumas"
      - "b) Sigue necesitando $O(n^2)$, solo cambia el orden"
      - "c) $2n$ multiplicaciones, el doble que antes"
      - "d) Ninguna: solo sumas"
    correcta: 0

  - id: "hintro_02"
    titulo: "Qué devuelve la división sintética"
    pregunta: >-
      Al evaluar $P(x)$ en $x_0$ con el algoritmo de Horner se generan los
      coeficientes $b_k$ (con $b_n=a_n$ y $b_k=a_k+b_{k+1}x_0$).
      Además del valor $P(x_0)=b_0$, **¿qué representan los demás $b_k$?**
    opciones:
      - "a) Los coeficientes del cociente $Q(x)$ de dividir $P(x)$ entre $(x-x_0)$"
      - "b) Las derivadas sucesivas de $P$ en $x_0$"
      - "c) Nada: son basura intermedia"
      - "d) Las raíces restantes del polinomio"
    correcta: 0

  - id: "hintro_03"
    titulo: "La segunda corrida"
    pregunta: >-
      Para obtener la **primera derivada** $P'(x_0)$ se aplica una **segunda** corrida
      de división sintética, esta vez sobre los coeficientes $b_k$, obteniendo $c_k$.
      **¿Cuál es el resultado?**
    opciones:
      - "a) $P'(x_0)=c_1$: la derivada sale del penúltimo coeficiente"
      - "b) $P'(x_0)=c_0$: igual que en la primera corrida"
      - "c) La segunda corrida da $P''(x_0)$"
      - "d) Hay que derivar a mano: la división sintética no sirve para derivar"
    correcta: 0

  - id: "hintro_04"
    titulo: "Para qué sirve deflactar"
    pregunta: >-
      Ya conoces una raíz exacta $r$ de $P(x)$ (es decir $P(r)=0$). Quieres encontrar
      **las demás** raíces. **¿Qué ganas al deflactar?**
    opciones:
      - "a) Bajas el grado en 1, así que el siguiente método trabaja con un problema más simple"
      - "b) Nada: la raíz $r$ sigue apareciendo en el polinomio reducido"
      - "c) Que la raíz $r$ se vuelva doble"
      - "d) Convierte el polinomio en uno de primer grado siempre"
    correcta: 0

HORNER_CONCL:
  - id: "hconcl_01"
    titulo: "Horner en un microcontrolador"
    pregunta: >-
      Un microcontrolador de 8 bits debe evaluar un polinomio de calibración de grado 4
      cada 10 ms. La multiplicación es la operación más costosa.
      **¿Por qué conviene programarlo en forma anidada?**
    opciones:
      - "a) Porque hace menos multiplicaciones, y además cada una se apoya en el resultado anterior"
      - "b) Porque así el resultado es exacto, sin error de redondeo"
      - "c) Porque el microcontrolador no puede sumar"
      - "d) Porque el polinomio deja de ser de grado 4"
    correcta: 0

  - id: "hconcl_02"
    titulo: "El residuo de la deflación"
    pregunta: >-
      Deflactas $P(x)$ entre $(x-r)$ y el residuo $b_0$ te sale distinto de cero.
      **¿Qué significa?**
    opciones:
      - "a) Que $r$ no es raíz exacta de $P$: el residuo es $P(r)$"
      - "b) Que te equivocaste en la aritmética pero $r$ sí es raíz"
      - "c) Que el polinomio no tiene raíces reales"
      - "d) Nada especial: el residuo siempre es distinto de cero"
    correcta: 0

  - id: "hconcl_03"
    titulo: "Error de redondeo: qué se puede afirmar"
    pregunta: >-
      Además del tiempo de cómputo, la forma anidada también cambia el error de
      redondeo. **¿Qué se puede afirmar de ese error?**
    opciones:
      - "a) Que suele ser algo más preciso, porque no arrastra el error de la cadena que calcula $x^k$; pero por factores pequeños y sin garantía"
      - "b) Que es exacto: elimina por completo el error de redondeo"
      - "c) Que da el mismo resultado bit a bit que la evaluación término a término"
      - "d) Que empeora: al encadenar $n$ operaciones acumula más error que calcular las potencias"
    correcta: 0

  - id: "hconcl_04"
    titulo: "Decisión: todas las raíces"
    pregunta: >-
      Tienes un polinomio de grado 5, ya encontraste **una** raíz real y necesitas
      **todas** las raíces. **¿Cuál es el camino correcto?**
    opciones:
      - "a) Deflactar con esa raíz y repetir el método sobre el polinomio de grado 4"
      - "b) Volver a correr el método sobre el polinomio original con otro valor inicial, hasta agotar los intentos"
      - "c) Descartar esa raíz: no sirve para encontrar las demás"
      - "d) Convertirlo en un sistema de ecuaciones no lineales"
    correcta: 0

  - id: "hconcl_05"
    titulo: "Qué garantiza siempre la forma anidada"
    pregunta: >-
      De las dos ventajas de Horner, una se cumple **siempre** y la otra depende
      del problema. **¿Cuál se garantiza siempre?**
    opciones:
      - "a) El costo: $n$ multiplicaciones y $n$ sumas, es decir $O(n)$ en lugar de $O(n^2)$"
      - "b) El error: queda del orden de $\\varepsilon$ por muy mal condicionado que esté el polinomio"
      - "c) El resultado exacto, sin ningún redondeo"
      - "d) Que el método ya no necesita evaluar el polinomio término a término"
    correcta: 0

# ---------------------------------------------------------------------
#  Banco de FLOTANTES: se contesta justo después de los laboratorios de
#  redondeo (B1 y B2) y de la celda de bits, así que TODO lo que pregunta
#  se puede leer ahí arriba. Son las cuatro ideas que esos laboratorios
#  acaban de medir: qué es ε, qué es κ, por qué la resta cancela y qué
#  cambia entre float32 y float64.
# ---------------------------------------------------------------------
FLOTANTES:
  - id: "flot_01"
    titulo: "Qué mide el épsilon de la máquina"
    pregunta: >-
      Un `float` de 64 bits guarda unas **16 cifras significativas siempre**,
      valga el número $10^{-160}$ o $10^{160}$. El épsilon de la máquina es
      $\varepsilon = \texttt{np.finfo(float).eps} = 2^{-52} \approx 2.22\times10^{-16}$.
      **¿Qué mide exactamente $\varepsilon$?**
    opciones:
      - "a) La distancia entre el $1.0$ y el siguiente número representable: el «peldaño» de la escalera alrededor del 1"
      - "b) El número más pequeño que la máquina puede guardar, es decir el fondo del rango"
      - "c) El número de cifras decimales que se muestran al imprimir un resultado"
      - "d) El error absoluto máximo: en cada operación se pierden $2.22\\times10^{-16}$ unidades"
    correcta: 0

  - id: "flot_02"
    titulo: "Quién decide los dígitos que se pierden"
    pregunta: >-
      En los laboratorios se evalúa el **mismo** polinomio término a término y con
      la forma anidada, contra un valor exacto calculado con fracciones. Con uno
      bien condicionado ($\kappa \approx 2$) los dos coinciden hasta el último bit;
      con $(x-1)^n$ desarrollado ($\kappa$ enorme) los dos pierden todos los
      dígitos. **¿Qué decide cuántos dígitos se conservan?**
    opciones:
      - "a) La condición de la evaluación, $\\kappa$: el error relativo va como $\\kappa\\,\\varepsilon$, no el método"
      - "b) El método: la forma anidada siempre conserva más dígitos que la evaluación término a término"
      - "c) El orden en que se escriben los coeficientes del polinomio"
      - "d) La presentación de los resultados: mostrando más cifras aparecerían más dígitos buenos"
    correcta: 0

  - id: "flot_03"
    titulo: "Por qué se pierden los dígitos al restar"
    pregunta: >-
      En el laboratorio mal condicionado se evalúa $P(x)=(x-1)^n$ **desarrollado**
      en $x = 1.0001$: los términos del desarrollo valen hasta $\sim 10^{17}$
      mientras el resultado verdadero es $10^{-4n}$. **¿Por qué se pierden los
      dígitos?**
    opciones:
      - "a) Porque al restar números grandes y casi iguales se cancelan las cifras significativas que tenían en común"
      - "b) Porque $\\binom{n}{k}$ es un número irracional y no se puede guardar"
      - "c) Porque elevar a una potencia grande un número cercano a 1 ya pierde precisión por sí solo"
      - "d) Porque son demasiadas operaciones y el error se acumula; con menos términos saldría exacto"
    correcta: 0

  - id: "flot_04"
    titulo: "Qué cambia al pasar a float32"
    pregunta: >-
      En la celda de bits se ve que `0.1` en `float32` se guarda como
      `0.100000001490116119384765625` y en `float64` como
      `0.1000000000000000055511151231257827021181583404541015625`.
      **¿Qué cambia entre las dos precisiones?**
    opciones:
      - "a) Las dos cosas: el rango (8 bits de exponente en lugar de 11) y la precisión (23 bits de mantisa en lugar de 52)"
      - "b) Solo el rango: se guardan las mismas 16 cifras, pero con exponentes más pequeños"
      - "c) Solo el número de cifras que se imprimen; el valor guardado es el mismo"
      - "d) Nada: Python convierte siempre a `float64` antes de guardar"
    correcta: 0

  - id: "flot_05"
    titulo: "Por qué el salto crece con la magnitud"
    pregunta: >-
      Alrededor del $1.0$ el salto entre números representables es
      $2.22\times10^{-16}$, pero alrededor de $10^{15}$ es de **0.125** (12.5 cm),
      y por eso `1e15 + 0.01 == 1e15` devuelve `True`.
      **¿Por qué ese salto crece con la magnitud del número?**
    opciones:
      - "a) Porque las cifras significativas son fijas: el error relativo $\\varepsilon$ se traduce en un salto absoluto $\\approx |x|\\,\\varepsilon$"
      - "b) Porque la máquina guarda menos cifras significativas cuando el número es grande"
      - "c) Porque $10^{15}$ no se puede guardar de forma exacta en punto flotante"
      - "d) Porque `np.spacing` redondea el resultado: el salto real no cambia"
    correcta: 0
